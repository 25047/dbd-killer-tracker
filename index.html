<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【非公式】DBDキラー戦績記録・分析ツール</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; background: #121212; color: #eee; }
    h1, h2 { color: #e53935; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    select, input[type="text"], .submit-btn { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
    .submit-btn { background: #e53935; font-weight: bold; cursor: pointer; margin-top: 15px; border: none; }
    .submit-btn:hover { background: #c62828; }
    .btn-group { display: grid; gap: 8px; margin-top: 6px; }
    .btn-group-gens { grid-template-columns: repeat(4, 1fr); }
    @media (min-width: 480px) {
      .btn-group-gens { grid-template-columns: repeat(7, 1fr); }
    }
    .btn-group-kills { grid-template-columns: repeat(5, 1fr); }
    .select-btn {
      padding: 10px 4px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #ccc;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
      transition: all 0.15s ease;
      text-align: center;
    }
    .select-btn:hover { background: #383838; color: #fff; border-color: #666; }
    .select-btn.active {
      background: #e53935;
      color: #fff;
      border-color: #ff5252;
      box-shadow: 0 0 10px rgba(229, 57, 53, 0.75), 0 0 2px #ff5252;
    }
    .killer-quick-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 6px;
    }
    .killer-quick-btn {
      padding: 7px 11px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #252525;
      color: #ddd;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      box-sizing: border-box;
    }
    .killer-quick-btn:hover {
      background: #333;
      border-color: #666;
      color: #fff;
    }
    /* 選択時の蛍光シアン発光エフェクト */
    .killer-quick-btn.active {
      border: 2px solid #00ffff;
      color: #ffffff;
      background: #14282e;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.75), inset 0 0 4px rgba(0, 255, 255, 0.25);
    }
    .killer-input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 5px;
    }
    .killer-input-container {
      position: relative;
      flex: 1;
    }
    .killer-input-container input {
      width: 100%;
      margin-top: 0;
    }
    .suggest-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      max-height: 220px;
      overflow-y: auto;
      background: #222;
      border: 1px solid #444;
      border-top: none;
      border-radius: 0 0 4px 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
      z-index: 1000;
      display: none;
      box-sizing: border-box;
    }
    .suggest-item {
      padding: 9px 12px;
      cursor: pointer;
      font-size: 0.92rem;
      color: #eee;
      border-bottom: 1px solid #2d2d2d;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease;
    }
    .suggest-item:last-child {
      border-bottom: none;
    }
    .suggest-item:hover,
    .suggest-item.active {
      background: #333;
      color: #fff;
      border-left: 4px solid #00ffff;
      padding-left: 8px;
    }
    .fav-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      margin: 0;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #777;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .fav-btn:hover {
      background: #333;
      border-color: #666;
    }
    .fav-btn.active {
      color: #ffd700;
      border-color: #ffd700;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.75);
    }
    .checkbox-group { display: flex; gap: 20px; margin-top: 8px; }
    .checkbox-label { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; margin-top: 0; }
    .checkbox-label input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; margin: 0; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 2px 7px; border-radius: 4px; margin-right: 6px; font-weight: bold; }
    .badge-camp { background: #b71c1c; color: #fff; }
    .badge-tunnel { background: #e65100; color: #fff; }
    .badge-none { background: #424242; color: #bbb; }
    ul { list-style: none; padding: 0; }
    li { background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 4px; border-left: 4px solid #e53935; }
    .history-meta { font-size: 0.85rem; color: #aaa; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; }
    th, td { padding: 8px 10px; text-align: center; border-bottom: 1px solid #333; }
    th { background: #252525; color: #ff8a80; font-weight: bold; }
    tr:nth-child(even) { background: #222; }
    tr:hover { background: #2c2c2c; }
    .reset-filter-btn {
      background: #2a2a2a;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      width: auto;
      margin-top: 0;
    }
    .reset-filter-btn:hover {
      background: #383838;
      border-color: #e53935;
      color: #fff;
    }
    .delete-match-btn {
      background: #252525;
      color: #bbb;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .delete-match-btn:hover {
      background: #b71c1c;
      color: #fff;
      border-color: #ff5252;
    }
    .backup-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .backup-btn {
      flex: 1;
      min-width: 180px;
      padding: 10px 12px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #2a2a2a;
      color: #eee;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      box-sizing: border-box;
    }
    .backup-btn:hover {
      background: #383838;
      border-color: #e53935;
      color: #fff;
    }
    .advice-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .advice-item {
      background: #252525;
      border: 1px solid #333;
      border-left: 4px solid #00bcd4;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 0.9rem;
      line-height: 1.55;
      color: #e0e0e0;
    }
    .advice-item.advice-info { border-left-color: #757575; color: #bbb; }
    .advice-item.advice-positive { border-left-color: #00e5ff; }
    .advice-item.advice-warning { border-left-color: #ff9800; }
    /* メインタブナビゲーション */
    .main-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
      background: #181818;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #2e2e2e;
    }
    .tab-btn {
      background: #222;
      color: #aaa;
      border: 1px solid #333;
      border-bottom: 3px solid transparent;
      border-radius: 6px;
      padding: 10px 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: center;
      white-space: nowrap;
    }
    .tab-btn:hover {
      background: #2b2b2b;
      color: #fff;
    }
    .tab-btn-input.active {
      background: rgba(255, 23, 68, 0.16);
      color: #fff;
      border-color: rgba(255, 23, 68, 0.45);
      border-bottom: 3px solid #ff1744;
      box-shadow: 0 4px 12px rgba(255, 23, 68, 0.35);
    }
    .tab-btn-analytics.active {
      background: rgba(0, 229, 255, 0.14);
      color: #fff;
      border-color: rgba(0, 229, 255, 0.45);
      border-bottom: 3px solid #00e5ff;
      box-shadow: 0 4px 12px rgba(0, 229, 255, 0.35);
    }
    .tab-btn-history.active {
      background: rgba(124, 77, 255, 0.18);
      color: #fff;
      border-color: rgba(124, 77, 255, 0.5);
      border-bottom: 3px solid #7c4dff;
      box-shadow: 0 4px 12px rgba(124, 77, 255, 0.35);
    }
    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }
    /* カードヘッダーバー & カテゴリー別カラーコーディング */
    .card > h2,
    .card-header-bar {
      margin: -15px -15px 14px -15px;
      padding: 11px 15px;
      background: #252525;
      border-bottom: 1px solid #333;
      border-radius: 7px 7px 0 0;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }
    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-header-bar h2 {
      margin: 0;
      padding: 0;
      background: transparent;
      border: none;
      font-size: 1.05rem;
    }
    /* 入力系テーマ: レッド系 (#ff1744 / #e53935) */
    .theme-input .card {
      border-top: 2px solid #e53935;
    }
    .theme-input .card > h2,
    .theme-input .card-header-bar {
      border-left: 4px solid #ff1744;
      background: linear-gradient(90deg, rgba(255, 23, 68, 0.16) 0%, #252525 100%);
      color: #ff8a80;
    }
    .theme-input .card-header-bar h2 {
      color: #ff8a80;
    }
    /* 分析・診断系テーマ: シアン・ブルー系 (#00e5ff / #00bcd4) */
    .theme-analytics .card {
      border-top: 2px solid #00bcd4;
    }
    .theme-analytics .card > h2,
    .theme-analytics .card-header-bar {
      border-left: 4px solid #00e5ff;
      background: linear-gradient(90deg, rgba(0, 229, 255, 0.14) 0%, #252525 100%);
      color: #A5E9E9;
    }
    .theme-analytics .card-header-bar h2 {
      color: #A5E9E9;
    }
    .theme-analytics th {
      color: #A5E9E9;
      border-bottom: 1px solid rgba(0, 229, 255, 0.3);
    }
    .theme-analytics .reset-filter-btn:hover {
      border-color: #00e5ff;
    }
    /* 履歴・設定系テーマ: パープル・スレート系 (#7c4dff / #90a4ae) */
    .theme-history .card {
      border-top: 2px solid #7c4dff;
    }
    .theme-history .card > h2,
    .theme-history .card-header-bar {
      border-left: 4px solid #7c4dff;
      background: linear-gradient(90deg, rgba(124, 77, 255, 0.18) 0%, #252525 100%);
      color: #b388ff;
    }
    .theme-history .card-header-bar h2 {
      color: #b388ff;
    }
    .theme-history #historyList li {
      border-left: 4px solid #7c4dff;
    }
    .theme-history .history-meta {
      color: #90a4ae;
    }
    .theme-history .backup-btn:hover {
      border-color: #7c4dff;
    }
  </style>
</head>
<body>
  <h1>【非公式】<br>DBDキラー戦績記録・分析ツール</h1>

  <nav class="main-tabs" id="mainTabNav">
    <button type="button" class="tab-btn tab-btn-input active" data-tab="tab-input">📝 記録入力</button>
    <button type="button" class="tab-btn tab-btn-analytics" data-tab="tab-analytics">📊 分析・診断</button>
    <button type="button" class="tab-btn tab-btn-history" data-tab="tab-history">📜 履歴・設定</button>
  </nav>

  <div id="tab-input" class="tab-panel active theme-input">
    <div class="card">
      <h2>試合結果の入力</h2>
      <form id="matchForm">
        <label>使用キラー</label>
        <div id="killerQuickArea" class="killer-quick-container"></div>
        <div class="killer-input-wrapper">
          <div class="killer-input-container">
            <input type="text" id="killer" placeholder="例: トラッパー, チャッキー, ナース" required autocomplete="off">
            <div id="killerSuggestList" class="suggest-dropdown"></div>
          </div>
          <button type="button" id="favToggleBtn" class="fav-btn" title="お気に入り登録/解除">☆</button>
        </div>

        <label>1人目キル時の残り発電機数</label>
        <input type="hidden" id="gensAtFirstKill" value="5">
        <div class="btn-group btn-group-gens" id="gensBtnGroup">
          <button type="button" class="select-btn active" data-value="5">5台</button>
          <button type="button" class="select-btn" data-value="4">4台</button>
          <button type="button" class="select-btn" data-value="3">3台</button>
          <button type="button" class="select-btn" data-value="2">2台</button>
          <button type="button" class="select-btn" data-value="1">1台</button>
          <button type="button" class="select-btn" data-value="0">0台</button>
          <button type="button" class="select-btn" data-value="none">キルなし</button>
        </div>

        <label>最終キル数（結果）</label>
        <input type="hidden" id="resultKills" value="4">
        <div class="btn-group btn-group-kills" id="killsBtnGroup">
          <button type="button" class="select-btn active" data-value="4">4キル</button>
          <button type="button" class="select-btn" data-value="3">3キル</button>
          <button type="button" class="select-btn" data-value="2">2キル</button>
          <button type="button" class="select-btn" data-value="1">1キル</button>
          <button type="button" class="select-btn" data-value="0">0キル</button>
        </div>

        <label>戦術の有無</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="hasCamp"> キャンプあり
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="hasTunnel"> トンネルあり
          </label>
        </div>

        <button type="button" id="recordBtn" class="submit-btn">戦績を記録</button>
      </form>
    </div>
  </div>

  <div id="tab-analytics" class="tab-panel theme-analytics">
    <div class="card" id="adviceCard">
      <h2>立ち回り診断・アドバイス</h2>
      <div id="adviceList" class="advice-list"></div>
    </div>

    <div class="card" id="filterCard">
      <div class="card-header-bar">
        <h2>キラーで絞り込み分析</h2>
        <button type="button" id="resetFilterBtn" class="reset-filter-btn">すべてのキラー</button>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div class="killer-input-container">
          <input type="text" id="filterKiller" placeholder="例: エイリアン, ナース（空欄で全件）" autocomplete="off" style="margin-top: 0;">
          <div id="filterSuggestList" class="suggest-dropdown"></div>
        </div>
      </div>
      <div id="filterStatus" style="font-size: 0.85rem; color: #aaa; margin-top: 6px;">表示中: すべてのキラー</div>
    </div>

    <div class="card">
      <h2>残り発電機ごとの戦績分析</h2>
      <table id="statsTable">
        <thead>
          <tr>
            <th style="text-align: left;">1人目キル時</th>
            <th>試合数</th>
            <th>平均キル</th>
            <th>勝率 (3K+)</th>
            <th>勝率 (4K)</th>
          </tr>
        </thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>戦術別戦績分析（キャンプ / トンネル）</h2>
      <table id="tacticsStatsTable">
        <thead>
          <tr>
            <th style="text-align: left;">戦術</th>
            <th>試合数</th>
            <th>平均キル</th>
            <th>勝率 (3K+)</th>
            <th>勝率 (4K)</th>
          </tr>
        </thead>
        <tbody id="tacticsStatsBody"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-history" class="tab-panel theme-history">
    <div class="card">
      <h2>対戦履歴</h2>
      <ul id="historyList"></ul>
    </div>

    <div class="card" id="backupCard">
      <h2>データのバックアップ・復元</h2>
      <div style="font-size: 0.85rem; color: #aaa;">対戦データをJSONファイルとして端末に保存・復元できます。</div>
      <div class="backup-btn-group">
        <button type="button" id="exportJsonBtn" class="backup-btn">💾 データ書き出し（JSON）</button>
        <button type="button" id="importJsonBtn" class="backup-btn">📂 データ読み込み（JSON）</button>
        <input type="file" id="importJsonInput" accept=".json,application/json" style="display: none;">
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('matchForm');
    const historyList = document.getElementById('historyList');
    const statsBody = document.getElementById('statsBody');
    const tacticsStatsBody = document.getElementById('tacticsStatsBody');

    const GEN_CATEGORIES = [
      { key: '5', label: '残り 5台' },
      { key: '4', label: '残り 4台' },
      { key: '3', label: '残り 3台' },
      { key: '2', label: '残り 2台' },
      { key: '1', label: '残り 1台' },
      { key: '0', label: '残り 0台（通電後）' },
      { key: 'none', label: 'キルなし' }
    ];

    const TACTICS_CATEGORIES = [
      { label: 'キャンプあり', filter: (m) => Boolean(m.hasCamp) === true },
      { label: 'キャンプなし', filter: (m) => Boolean(m.hasCamp) === false },
      { label: 'トンネルあり', filter: (m) => Boolean(m.hasTunnel) === true },
      { label: 'トンネルなし', filter: (m) => Boolean(m.hasTunnel) === false }
    ];

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (s) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[s]);
    }

    function updateStats(matches) {
      const stats = {};
      GEN_CATEGORIES.forEach(cat => {
        stats[cat.key] = { count: 0, totalKills: 0, wins: 0, wins4: 0 };
      });

      matches.forEach(m => {
        const key = m.gensAtFirstKill;
        if (stats[key]) {
          const kills = Number(m.resultKills) || 0;
          stats[key].count += 1;
          stats[key].totalKills += kills;
          if (kills >= 3) {
            stats[key].wins += 1;
          }
          if (kills === 4) {
            stats[key].wins4 += 1;
          }
        }
      });

      statsBody.innerHTML = '';
      GEN_CATEGORIES.forEach(cat => {
        const data = stats[cat.key];
        const tr = document.createElement('tr');

        const avgKills = data.count > 0 ? (data.totalKills / data.count).toFixed(2) : '-';
        const winRate = data.count > 0 ? ((data.wins / data.count) * 100).toFixed(1) + '%' : '-';
        const winRate4 = data.count > 0 ? ((data.wins4 / data.count) * 100).toFixed(1) + '%' : '-';

        tr.innerHTML = `
          <td style="text-align: left;">${cat.label}</td>
          <td>${data.count}</td>
          <td>${avgKills}</td>
          <td>${winRate}</td>
          <td>${winRate4}</td>
        `;
        statsBody.appendChild(tr);
      });
    }

    function updateTacticsStats(matches) {
      tacticsStatsBody.innerHTML = '';

      TACTICS_CATEGORIES.forEach(cat => {
        let count = 0;
        let totalKills = 0;
        let wins = 0;
        let wins4 = 0;

        matches.forEach(m => {
          if (cat.filter(m)) {
            const kills = Number(m.resultKills) || 0;
            count += 1;
            totalKills += kills;
            if (kills >= 3) {
              wins += 1;
            }
            if (kills === 4) {
              wins4 += 1;
            }
          }
        });

        const avgKills = count > 0 ? (totalKills / count).toFixed(2) : '-';
        const winRate = count > 0 ? ((wins / count) * 100).toFixed(1) + '%' : '-';
        const winRate4 = count > 0 ? ((wins4 / count) * 100).toFixed(1) + '%' : '-';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="text-align: left;">${cat.label}</td>
          <td>${count}</td>
          <td>${avgKills}</td>
          <td>${winRate}</td>
          <td>${winRate4}</td>
        `;
        tacticsStatsBody.appendChild(tr);
      });
    }

    let currentFilterKiller = '';

    function getFilteredMatches(allMatches) {
      if (!currentFilterKiller) return allMatches;
      const normalizedFilter = normalizeKillerName(currentFilterKiller);
      return allMatches.filter(m => normalizeKillerName(m.killer) === normalizedFilter);
    }

    function updateFilterStatus(totalCount, filteredCount) {
      const statusEl = document.getElementById('filterStatus');
      if (!statusEl) return;
      if (!currentFilterKiller) {
        statusEl.textContent = `表示中: すべてのキラー（全 ${totalCount} 件）`;
      } else {
        const norm = normalizeKillerName(currentFilterKiller);

    function generateMatchId() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);

    function getMatchesWithIds() {
      const matches = JSON.parse(localStorage.getItem('dbd_matches') || '[]');
      let updated = false;
      matches.forEach((m, idx) => {
        if (!m.id) {
          m.id = `${Date.now().toString(36)}-${idx}-${Math.random().toString(36).slice(2, 7)}`;
          updated = true;
        }
      });
      if (updated) {
        localStorage.setItem('dbd_matches', JSON.stringify(matches));
      }
      return matches;
    }

    function deleteMatch(matchId) {
      if (!matchId) return;
      const matches = getMatchesWithIds();
      const target = matches.find(m => m.id === matchId);
      if (!target) return;

      const isConfirmed = window.confirm(
        `【${target.killer}】（結果: ${target.resultKills}キル / ${target.date}）の戦績を削除しますか？\nこの操作は取り消せません。`
      );
      if (!isConfirmed) return;

      const nextMatches = matches.filter(m => m.id !== matchId);
      localStorage.setItem('dbd_matches', JSON.stringify(nextMatches));
      renderKillerQuickButtons();
      loadHistory();
    }

    // ===== 立ち回り診断（固定テンプレート・条件分岐のみで制御） =====
    function calcWinRate(list) {
      if (!list || list.length === 0) return null;
      const wins = list.filter(m => (Number(m.resultKills) || 0) >= 3).length;
      return (wins / list.length) * 100;
    }

    function computeAdvice(matches) {
      const total = matches.length;
      const MIN_MATCHES = 3;
      if (total < MIN_MATCHES) {
        return [{
          type: 'info',
          text: `💡 【データ蓄積中】 現在の記録は ${total} 試合です。あと ${MIN_MATCHES - total} 試合記録すると、立ち回り傾向の自動診断が表示されます。`
        }];
      }

      const fmt = (v) => v.toFixed(1);
      const advice = [];
      const overallWinRate = calcWinRate(matches);
      const totalKills = matches.reduce((s, m) => s + (Number(m.resultKills) || 0), 0);
      const avgKills = (totalKills / total).toFixed(2);

      // ケース1-A: 残り3台以上でファーストキル
      const earlyMatches = matches.filter(m => ['5', '4', '3'].includes(String(m.gensAtFirstKill)));
      const earlyWinRate = calcWinRate(earlyMatches);
      if (earlyWinRate !== null && earlyWinRate >= 70) {
        advice.push({
          type: 'positive',
          text: `⚡ 【序盤の圧力が強力】 残り発電機3台以上で1人目を撃破できた試合の勝率は ${fmt(earlyWinRate)}% です！序盤の迅速な1人落としが勝利の決定打になっています。`
        });
      }

      // ケース1-B: 残り0〜1台（合算）が他の各区分（5/4/3/2台）以上、かつ全体勝率50%以上
      const countGen = (g) => matches.filter(m => String(m.gensAtFirstKill) === g).length;
      const lateCount = countGen('0') + countGen('1');
      const otherMax = Math.max(countGen('5'), countGen('4'), countGen('3'), countGen('2'));
      if (lateCount > 0 && lateCount >= otherMax && overallWinRate >= 50) {
        advice.push({
          type: 'positive',
          text: `⏳ 【粘り強い終盤重視タイプ】 1人目の撃破が発電機残り0〜1台までもつれ込む傾向がありますが、勝率は ${fmt(overallWinRate)}% を維持できています。通電間際の立ち回りで着実に巻き返せています。`
        });
      }

      // 戦術別
      const tacticsMatches = matches.filter(m => Boolean(m.hasCamp) || Boolean(m.hasTunnel));
      const noTacticsMatches = matches.filter(m => !Boolean(m.hasCamp) && !Boolean(m.hasTunnel));
      const tacticsWinRate = calcWinRate(tacticsMatches);
      const noTacticsWinRate = calcWinRate(noTacticsMatches);

      // ケース2-A
      if (tacticsWinRate !== null && noTacticsWinRate !== null && (tacticsWinRate - noTacticsWinRate) >= 25) {
        advice.push({
          type: 'positive',
          text: `🎯 【戦術介入の効果が顕著】 キャンプ/トンネルあり時の勝率（${fmt(tacticsWinRate)}%）が、なし時（${fmt(noTacticsWinRate)}%）を大きく上回っています。状況に応じた戦術的な人数減らしが非常に有効に機能しています。`
        });
      }

      // ケース2-B
      if (noTacticsWinRate !== null && noTacticsWinRate >= 65) {
        advice.push({
          type: 'positive',
          text: `🛡️ 【高い基礎盤面管理力】 キャンプ・トンネルを行わない試合でも勝率 ${fmt(noTacticsWinRate)}% を達成しています！チェイス力と発電機巡回のみで盤面を支配できています。`
        });
      }

      // ケース2-C
      if (tacticsWinRate !== null && tacticsWinRate < 40) {
        advice.push({
          type: 'warning',
          text: `🔄 【立ち回りの切り替えを推奨】 キャンプ/トンネルを適用した試合の勝率が ${fmt(tacticsWinRate)}% に留まっています。無理なフック維持よりも、他サバイバーへの負傷ばら撒きや発電機遅延に立ち回りを切り替える方が効果的な可能性があります。`
        });
      }

      // ケース3-A
      if (overallWinRate >= 75) {
        advice.push({
          type: 'positive',
          text: `🏆 【圧倒的な勝率】 通算勝率 ${fmt(overallWinRate)}%（平均キル数 ${avgKills}）を記録中。極めて安定した立ち回りができています！`
        });
      }

      if (advice.length === 0) {
        advice.push({ type: 'info', text: '現在、該当する診断はありません' });
      }
      return advice;
    }

    function normalizeKillerName(input) {
      if (!input) return '';
      const str = input.trim();
      const exact = KILLER_LIST.find(k => k.name === str);
      if (exact) return exact.name;

      for (const k of KILLER_LIST) {
        if (str.includes(k.name)) return k.name;
        for (const alias of k.aliases) {
          if (str.includes(alias)) return k.name;
        }
      }
      return str;
    }

    function getKillerInfo(name) {
      const norm = normalizeKillerName(name);
      return KILLER_LIST.find(k => k.name === norm) || { name: norm, emoji: '👤', aliases: [norm] };
    }

    function getKillerDisplayText(k) {
      const aliasText = k.aliases.filter(a => a !== k.name).join(' / ');
      return `${k.emoji}${k.name}` + (aliasText ? `（${aliasText}）` : '');
    }

    function setupKillerSuggest({ inputId, suggestListId, onSelect, onInputClear, onInput }) {
      const inputEl = document.getElementById(inputId);
      const suggestList = document.getElementById(suggestListId);
      if (!inputEl || !suggestList) return null;

      let activeIndex = -1;
      let currentMatched = [];

      function highlightItem(index) {
        const items = suggestList.querySelectorAll('.suggest-item');
        items.forEach((item, idx) => {
          if (idx === index) {
            item.classList.add('active');
            item.scrollIntoView({ block: 'nearest' });
          } else {
            item.classList.remove('active');
          }
        });
        activeIndex = index;
      }

      function hideSuggest() {
        suggestList.style.display = 'none';
        suggestList.innerHTML = '';
        activeIndex = -1;
        currentMatched = [];
      }

      function renderSuggest(query) {
        const q = (query || '').trim();
        if (!q) {
          hideSuggest();
          if (onInputClear) onInputClear();
          return;
        }

        currentMatched = KILLER_LIST.filter(k => {
          if (k.name.includes(q)) return true;
          for (const a of k.aliases) {
            if (a.includes(q)) return true;
          }
          return false;
        });

        if (currentMatched.length === 0) {
          hideSuggest();
          return;
        }

        suggestList.innerHTML = '';
        activeIndex = -1;

        currentMatched.forEach((k, idx) => {
          const item = document.createElement('div');
          item.className = 'suggest-item';
          item.textContent = getKillerDisplayText(k);
          item.addEventListener('mouseenter', () => {
            highlightItem(idx);
          });
          item.addEventListener('click', () => {
            chooseKiller(k);
          });
          suggestList.appendChild(item);
        });

        suggestList.style.display = 'block';
      }

      function chooseKiller(killer) {
        inputEl.value = killer.name;
        hideSuggest();
        if (onSelect) onSelect(killer);
      }

      inputEl.addEventListener('input', (e) => {
        renderSuggest(e.target.value);
        if (onInput) onInput(e.target.value);
      });

      inputEl.addEventListener('focus', (e) => {
        if (e.target.value.trim()) {
          renderSuggest(e.target.value);
        }
      });

      inputEl.addEventListener('keydown', (e) => {
        const isShowing = suggestList.style.display === 'block' && currentMatched.length > 0;

        if (e.key === 'ArrowDown') {
          if (!isShowing) {
            if (inputEl.value.trim()) {
              renderSuggest(inputEl.value);
            }
            return;
          }
          e.preventDefault();
          let nextIndex = activeIndex + 1;
          if (nextIndex >= currentMatched.length) {
            nextIndex = 0;
          }
          highlightItem(nextIndex);
        } else if (e.key === 'ArrowUp') {
          if (!isShowing) return;
          e.preventDefault();
          let prevIndex = activeIndex - 1;
          if (prevIndex < 0) {
            prevIndex = currentMatched.length - 1;
          }
          highlightItem(prevIndex);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (isShowing && activeIndex >= 0 && activeIndex < currentMatched.length) {
            chooseKiller(currentMatched[activeIndex]);
          }
        } else if (e.key === 'Escape') {
          if (isShowing) {
            e.preventDefault();
            hideSuggest();
          }
        }
      });

      document.addEventListener('click', (e) => {
        const container = inputEl.closest('.killer-input-container');
        if (container && !container.contains(e.target)) {
          hideSuggest();
        }
      });

      return {
        render: renderSuggest,
        hide: hideSuggest
      };
    }

      e.preventDefault();
    });

    function handleRecordMatch() {
      const rawKiller = document.getElementById('killer').value.trim();
      if (!rawKiller) {
        alert('使用キラーを入力または選択してください');
        return;
      }
      const normalizedKiller = normalizeKillerName(rawKiller);

      const newMatch = {
        id: generateMatchId(),
        killer: normalizedKiller || rawKiller,
        gensAtFirstKill: document.getElementById('gensAtFirstKill').value,
        resultKills: document.getElementById('resultKills').value,
        hasCamp: document.getElementById('hasCamp').checked,
        hasTunnel: document.getElementById('hasTunnel').checked,
        date: new Date().toLocaleDateString('ja-JP')
      };
      const matches = getMatchesWithIds();
      matches.push(newMatch);
      localStorage.setItem('dbd_matches', JSON.stringify(matches));
      form.reset();
      resetSelectButtons();
      if (killerSuggestInstance) killerSuggestInstance.hide();
      renderKillerQuickButtons();
      loadHistory();
    }

    const recordBtn = document.getElementById('recordBtn');
    if (recordBtn) {
      recordBtn.addEventListener('click', handleRecordMatch);
    }

    function getBackupFilename(now = new Date()) {
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `dbd_matches_backup_${yyyy}${mm}${dd}.json`;
    }

    function exportMatchesToJson() {
      const matches = getMatchesWithIds();
      if (matches.length === 0) {
        alert('書き出す対戦データがありません');
        return;
      }
      const jsonStr = JSON.stringify(matches, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = getBackupFilename();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function validateImportedMatches(data) {
      if (!Array.isArray(data)) return false;
      const validGens = ['5', '4', '3', '2', '1', '0', 'none'];
      for (const item of data) {
        if (!item || typeof item !== 'object' || Array.isArray(item)) return false;
        if (typeof item.killer !== 'string' || !item.killer.trim()) return false;
        if (item.gensAtFirstKill === undefined || item.gensAtFirstKill === null) return false;
        if (!validGens.includes(String(item.gensAtFirstKill))) return false;
        if (item.resultKills === undefined || item.resultKills === null) return false;
        const killsNum = Number(item.resultKills);
        if (Number.isNaN(killsNum) || killsNum < 0 || killsNum > 4) return false;
      }
      return true;
    }

    function mergeImportedMatches(importedList) {
      const existingMatches = getMatchesWithIds();
      const matchMap = new Map();
      existingMatches.forEach(m => {
        matchMap.set(m.id, m);
      });

      importedList.forEach((item, idx) => {
        const rawKiller = String(item.killer).trim();
        const normalizedKiller = normalizeKillerName(rawKiller);
        const matchId = (typeof item.id === 'string' && item.id.trim())
          ? item.id.trim()
          : `${Date.now().toString(36)}-imp-${idx}-${Math.random().toString(36).slice(2, 7)}`;

        const normalizedRecord = {
          id: matchId,
          killer: normalizedKiller || rawKiller,
          gensAtFirstKill: String(item.gensAtFirstKill),
          resultKills: String(item.resultKills),
          hasCamp: Boolean(item.hasCamp),
          hasTunnel: Boolean(item.hasTunnel),
          date: item.date ? String(item.date) : new Date().toLocaleDateString('ja-JP')
        };
        matchMap.set(matchId, normalizedRecord);
      });

      const merged = Array.from(matchMap.values());
      localStorage.setItem('dbd_matches', JSON.stringify(merged));
      renderKillerQuickButtons();
      loadHistory();
      return merged;
    }

    function handleImportJsonText(jsonText) {
      let parsed;
      try {
        parsed = JSON.parse(jsonText);
      } catch (err) {
        alert('エラー: JSONファイルの解析に失敗しました。ファイル形式を確認してください。');
        return false;
      }

      if (!validateImportedMatches(parsed)) {
        alert('エラー: 不正なJSONデータ構造です。有効な対戦データ配列ではありません。');
        return false;
      }

      const isConfirmed = window.confirm('ファイルを読み込んで対戦データを復元・追加しますか？');
      if (!isConfirmed) {
        return false;
      }

      mergeImportedMatches(parsed);
      return true;
    }

    const exportJsonBtn = document.getElementById('exportJsonBtn');
    if (exportJsonBtn) {
      exportJsonBtn.addEventListener('click', exportMatchesToJson);
    }

    const importJsonBtn = document.getElementById('importJsonBtn');
    const importJsonInput = document.getElementById('importJsonInput');
    if (importJsonBtn && importJsonInput) {
      importJsonBtn.addEventListener('click', () => {
        importJsonInput.value = '';
        importJsonInput.click();
      });

      importJsonInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          handleImportJsonText(String(ev.target.result || ''));
          importJsonInput.value = '';
        };
        reader.onerror = () => {
          alert('エラー: ファイルの読み込みに失敗しました。');
          importJsonInput.value = '';
        };
        reader.readAsText(file);
      });
    }

    function switchMainTab(targetTabId) {
      const tabNav = document.getElementById('mainTabNav');
      if (tabNav) {
        tabNav.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === targetTabId);
        });
      }
      document.querySelectorAll('.tab-panel').forEach(panel => {
        panel.classList.toggle('active', panel.id === targetTabId);
      });
    }

    function setupMainTabs() {
      const tabNav = document.getElementById('mainTabNav');
      if (!tabNav) return;
      tabNav.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          switchMainTab(btn.dataset.tab);
        });
      });
    }

    setupMainTabs();
    loadHistory();
  </script>
</body>
</html>
