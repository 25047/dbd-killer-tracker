<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【非公式】DBDキラー戦績記録・分析ツール</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; background: #121212; color: #eee; }
    h1, h2 { color: #e53935; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    select, input[type="text"], .submit-btn { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
    .submit-btn { background: #e53935; font-weight: bold; cursor: pointer; margin-top: 15px; border: none; }
    .submit-btn:hover { background: #c62828; }
    .btn-group { display: grid; gap: 8px; margin-top: 6px; }
    .btn-group-gens { grid-template-columns: repeat(4, 1fr); }
    @media (min-width: 480px) {
      .btn-group-gens { grid-template-columns: repeat(7, 1fr); }
    }
    .btn-group-kills { grid-template-columns: repeat(5, 1fr); }
    .select-btn {
      padding: 10px 4px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #ccc;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
      transition: all 0.15s ease;
      text-align: center;
    }
    .select-btn:hover { background: #383838; color: #fff; border-color: #666; }
    .select-btn.active {
      background: #e53935;
      color: #fff;
      border-color: #ff5252;
      box-shadow: 0 0 10px rgba(229, 57, 53, 0.75), 0 0 2px #ff5252;
    }
    .killer-quick-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 6px;
    }
    .killer-quick-btn {
      padding: 7px 11px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #252525;
      color: #ddd;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      box-sizing: border-box;
    }
    .killer-quick-btn:hover {
      background: #333;
      border-color: #666;
      color: #fff;
    }
    /* 選択時の蛍光シアン発光エフェクト */
    .killer-quick-btn.active {
      border: 2px solid #00ffff;
      color: #ffffff;
      background: #14282e;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.75), inset 0 0 4px rgba(0, 255, 255, 0.25);
    }
    .killer-input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 5px;
    }
    .killer-input-container {
      position: relative;
      flex: 1;
    }
    .killer-input-container input {
      width: 100%;
      margin-top: 0;
    }
    .suggest-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      max-height: 220px;
      overflow-y: auto;
      background: #222;
      border: 1px solid #444;
      border-top: none;
      border-radius: 0 0 4px 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
      z-index: 1000;
      display: none;
      box-sizing: border-box;
    }
    .suggest-item {
      padding: 9px 12px;
      cursor: pointer;
      font-size: 0.92rem;
      color: #eee;
      border-bottom: 1px solid #2d2d2d;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease;
    }
    .suggest-item:last-child {
      border-bottom: none;
    }
    .suggest-item:hover,
    .suggest-item.active {
      background: #333;
      color: #fff;
      border-left: 4px solid #00ffff;
      padding-left: 8px;
    }
    .fav-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      margin: 0;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #777;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .fav-btn:hover {
      background: #333;
      border-color: #666;
    }
    .fav-btn.active {
      color: #ffd700;
      border-color: #ffd700;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.75);
    }
    .checkbox-group { display: flex; gap: 20px; margin-top: 8px; }
    .checkbox-label { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; margin-top: 0; }
    .checkbox-label input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; margin: 0; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 2px 7px; border-radius: 4px; margin-right: 6px; font-weight: bold; }
    .badge-camp { background: #b71c1c; color: #fff; }
    .badge-tunnel { background: #e65100; color: #fff; }
    .badge-none { background: #424242; color: #bbb; }
    ul { list-style: none; padding: 0; }
    li { background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 4px; border-left: 4px solid #e53935; }
    .history-meta { font-size: 0.85rem; color: #aaa; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; }
    th, td { padding: 8px 10px; text-align: center; border-bottom: 1px solid #333; }
    th { background: #252525; color: #ff8a80; font-weight: bold; }
    tr:nth-child(even) { background: #222; }
    tr:hover { background: #2c2c2c; }
    .reset-filter-btn {
      background: #2a2a2a;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      width: auto;
      margin-top: 0;
    }
    .reset-filter-btn:hover {
      background: #383838;
      border-color: #e53935;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>【非公式】<br>DBDキラー戦績記録・分析ツール</h1>
  
  <div class="card">
    <h2>試合結果の入力</h2>
    <form id="matchForm">
      <label>使用キラー</label>
      <div id="killerQuickArea" class="killer-quick-container"></div>
      <div class="killer-input-wrapper">
        <div class="killer-input-container">
          <input type="text" id="killer" placeholder="例: トラッパー, チャッキー, ナース" required autocomplete="off">
          <div id="killerSuggestList" class="suggest-dropdown"></div>
        </div>
        <button type="button" id="favToggleBtn" class="fav-btn" title="お気に入り登録/解除">☆</button>
      </div>

      <label>1人目キル時の残り発電機数</label>
      <input type="hidden" id="gensAtFirstKill" value="5">
      <div class="btn-group btn-group-gens" id="gensBtnGroup">
        <button type="button" class="select-btn active" data-value="5">5台</button>
        <button type="button" class="select-btn" data-value="4">4台</button>
        <button type="button" class="select-btn" data-value="3">3台</button>
        <button type="button" class="select-btn" data-value="2">2台</button>
        <button type="button" class="select-btn" data-value="1">1台</button>
        <button type="button" class="select-btn" data-value="0">0台</button>
        <button type="button" class="select-btn" data-value="none">キルなし</button>
      </div>

      <label>最終キル数（結果）</label>
      <input type="hidden" id="resultKills" value="4">
      <div class="btn-group btn-group-kills" id="killsBtnGroup">
        <button type="button" class="select-btn active" data-value="4">4キル</button>
        <button type="button" class="select-btn" data-value="3">3キル</button>
        <button type="button" class="select-btn" data-value="2">2キル</button>
        <button type="button" class="select-btn" data-value="1">1キル</button>
        <button type="button" class="select-btn" data-value="0">0キル</button>
      </div>

      <label>戦術の有無</label>
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="hasCamp"> キャンプあり
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="hasTunnel"> トンネルあり
        </label>
      </div>

      <button type="button" id="recordBtn" class="submit-btn">戦績を記録</button>
    </form>
  </div>

  <div class="card" id="filterCard">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h2 style="margin: 0;">キラーで絞り込み分析</h2>
      <button type="button" id="resetFilterBtn" class="reset-filter-btn">すべてのキラー</button>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <div class="killer-input-container">
        <input type="text" id="filterKiller" placeholder="例: エイリアン, ナース（空欄で全件）" autocomplete="off" style="margin-top: 0;">
        <div id="filterSuggestList" class="suggest-dropdown"></div>
      </div>
    </div>
    <div id="filterStatus" style="font-size: 0.85rem; color: #aaa; margin-top: 6px;">表示中: すべてのキラー</div>
  </div>

  <div class="card">
    <h2>残り発電機ごとの戦績分析</h2>
    <table id="statsTable">
      <thead>
        <tr>
          <th style="text-align: left;">1人目キル時</th>
          <th>試合数</th>
          <th>平均キル</th>
          <th>勝率 (3K+)</th>
          <th>勝率 (4K)</th>
        </tr>
      </thead>
      <tbody id="statsBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>戦術別戦績分析（キャンプ / トンネル）</h2>
    <table id="tacticsStatsTable">
      <thead>
        <tr>
          <th style="text-align: left;">戦術</th>
          <th>試合数</th>
          <th>平均キル</th>
          <th>勝率 (3K+)</th>
          <th>勝率 (4K)</th>
        </tr>
      </thead>
      <tbody id="tacticsStatsBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>対戦履歴</h2>
    <ul id="historyList"></ul>
  </div>

  <script>
    const form = document.getElementById('matchForm');
    const historyList = document.getElementById('historyList');
    const statsBody = document.getElementById('statsBody');
    const tacticsStatsBody = document.getElementById('tacticsStatsBody');

    const GEN_CATEGORIES = [
      { key: '5', label: '残り 5台' },
      { key: '4', label: '残り 4台' },
      { key: '3', label: '残り 3台' },
      { key: '2', label: '残り 2台' },
      { key: '1', label: '残り 1台' },
      { key: '0', label: '残り 0台（通電後）' },
      { key: 'none', label: 'キルなし' }
    ];

    const TACTICS_CATEGORIES = [
      { label: 'キャンプあり', filter: (m) => Boolean(m.hasCamp) === true },
      { label: 'キャンプなし', filter: (m) => Boolean(m.hasCamp) === false },
      { label: 'トンネルあり', filter: (m) => Boolean(m.hasTunnel) === true },
      { label: 'トンネルなし', filter: (m) => Boolean(m.hasTunnel) === false }
    ];

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (s) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[s]);
    }

    function updateStats(matches) {
      const stats = {};
      GEN_CATEGORIES.forEach(cat => {
        stats[cat.key] = { count: 0, totalKills: 0, wins: 0, wins4: 0 };
      });

      matches.forEach(m => {
        const key = m.gensAtFirstKill;
        if (stats[key]) {
          const kills = Number(m.resultKills) || 0;
          stats[key].count += 1;
          stats[key].totalKills += kills;
          if (kills >= 3) {
            stats[key].wins += 1;
          }
          if (kills === 4) {
            stats[key].wins4 += 1;
          }
        }
      });

      statsBody.innerHTML = '';
      GEN_CATEGORIES.forEach(cat => {
        const data = stats[cat.key];
        const tr = document.createElement('tr');

        const avgKills = data.count > 0 ? (data.totalKills / data.count).toFixed(2) : '-';
        const winRate = data.count > 0 ? ((data.wins / data.count) * 100).toFixed(1) + '%' : '-';
        const winRate4 = data.count > 0 ? ((data.wins4 / data.count) * 100).toFixed(1) + '%' : '-';

        tr.innerHTML = `
          <td style="text-align: left;">${cat.label}</td>
          <td>${data.count}</td>
          <td>${avgKills}</td>
          <td>${winRate}</td>
          <td>${winRate4}</td>
        `;
        statsBody.appendChild(tr);
      });
    }

    function updateTacticsStats(matches) {
      tacticsStatsBody.innerHTML = '';

      TACTICS_CATEGORIES.forEach(cat => {
        let count = 0;
        let totalKills = 0;
        let wins = 0;
        let wins4 = 0;

        matches.forEach(m => {
          if (cat.filter(m)) {
            const kills = Number(m.resultKills) || 0;
            count += 1;
            totalKills += kills;
            if (kills >= 3) {
              wins += 1;
            }
            if (kills === 4) {
              wins4 += 1;
            }
          }
        });

        const avgKills = count > 0 ? (totalKills / count).toFixed(2) : '-';
        const winRate = count > 0 ? ((wins / count) * 100).toFixed(1) + '%' : '-';
        const winRate4 = count > 0 ? ((wins4 / count) * 100).toFixed(1) + '%' : '-';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="text-align: left;">${cat.label}</td>
          <td>${count}</td>
          <td>${avgKills}</td>
          <td>${winRate}</td>
          <td>${winRate4}</td>
        `;
        tacticsStatsBody.appendChild(tr);
      });
    }

    let currentFilterKiller = '';

    function getFilteredMatches(allMatches) {
      if (!currentFilterKiller) return allMatches;
      const normalizedFilter = normalizeKillerName(currentFilterKiller);
      return allMatches.filter(m => normalizeKillerName(m.killer) === normalizedFilter);
    }

    function updateFilterStatus(totalCount, filteredCount) {
      const statusEl = document.getElementById('filterStatus');
      if (!statusEl) return;
      if (!currentFilterKiller) {
        statusEl.textContent = `表示中: すべてのキラー（全 ${totalCount} 件）`;
      } else {
        const norm = normalizeKillerName(currentFilterKiller);
        const info = getKillerInfo(norm);
        if (filteredCount === 0) {
          statusEl.textContent = `表示中: 【${info.emoji} ${info.name}】 該当する対戦データはありません（0件）`;
        } else {
          statusEl.textContent = `表示中: 【${info.emoji} ${info.name}】 絞り込み結果: ${filteredCount} 件 / 全 ${totalCount} 件`;
        }
      }
    }

    function loadHistory() {
      const matches = JSON.parse(localStorage.getItem('dbd_matches') || '[]');
      const filteredMatches = getFilteredMatches(matches);

      updateStats(filteredMatches);
      updateTacticsStats(filteredMatches);
      updateFilterStatus(matches.length, filteredMatches.length);

      if (filteredMatches.length === 0) {
        if (currentFilterKiller) {
          historyList.innerHTML = '<li style="color:#aaa;">該当する対戦データはありません（-）</li>';
        } else {
          historyList.innerHTML = '<li>まだ記録がありません</li>';
        }
        return;
      }

      historyList.innerHTML = '';
      [...filteredMatches].reverse().forEach(m => {
        const li = document.createElement('li');
        const genText = m.gensAtFirstKill === 'none' ? 'キルなし' : `残り発電機 ${m.gensAtFirstKill}台`;
        
        // 後方互換性: 未定義(undefined/null)の場合はfalse扱い
        const hasCamp = Boolean(m.hasCamp);
        const hasTunnel = Boolean(m.hasTunnel);

        let badges = '';
        if (hasCamp) {
          badges += '<span class="badge badge-camp">キャンプあり</span>';
        }
        if (hasTunnel) {
          badges += '<span class="badge badge-tunnel">トンネルあり</span>';
        }
        if (!hasCamp && !hasTunnel) {
          badges += '<span class="badge badge-none">戦術なし</span>';
        }

        li.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-weight: bold;">【${escapeHtml(m.killer)}】 結果: ${escapeHtml(m.resultKills)}キル</span>
            <span class="history-meta">${escapeHtml(m.date)}</span>
          </div>
          <div style="font-size: 0.9rem; color: #bbb; margin-top: 4px;">1人目キル時: ${genText}</div>
          <div style="margin-top: 6px;">${badges}</div>
        `;
        historyList.appendChild(li);
      });
    }

    function setupSelectButtonGroup(groupId, hiddenInputId) {
      const group = document.getElementById(groupId);
      const hiddenInput = document.getElementById(hiddenInputId);
      const buttons = group.querySelectorAll('.select-btn');

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          hiddenInput.value = btn.dataset.value;
        });
      });
    }

    function resetSelectButtons() {
      const genInput = document.getElementById('gensAtFirstKill');
      genInput.value = '5';
      document.querySelectorAll('#gensBtnGroup .select-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.value === '5');
      });

      const killsInput = document.getElementById('resultKills');
      killsInput.value = '4';
      document.querySelectorAll('#killsBtnGroup .select-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.value === '4');
      });
    }

    const KILLER_LIST = [
      { name: 'トラッパー', emoji: '🪤', aliases: ['トラッパー'] },
      { name: 'レイス', emoji: '🔔', aliases: ['レイス'] },
      { name: 'ヒルビリー', emoji: '🔨', aliases: ['ヒルビリー', 'ビリー'] },
      { name: 'ナース', emoji: '🪚', aliases: ['ナース'] },
      { name: 'ハグ', emoji: '🔯', aliases: ['ハグ'] },
      { name: 'ドクター', emoji: '⚡', aliases: ['ドクター'] },
      { name: 'シェイプ', emoji: '🔪', aliases: ['シェイプ', 'マイケル'] },
      { name: 'ハントレス', emoji: '🪓', aliases: ['ハントレス'] },
      { name: 'カニバル', emoji: '🍖', aliases: ['カニバル', 'レザーフェイス'] },
      { name: 'ナイトメア', emoji: '😴', aliases: ['ナイトメア', 'フレディ'] },
      { name: 'ピッグ', emoji: '🐷', aliases: ['ピッグ'] },
      { name: 'クラウン', emoji: '🤡', aliases: ['クラウン'] },
      { name: 'スピリット', emoji: '👻', aliases: ['スピリット', '山岡凛', '凛'] },
      { name: 'リージョン', emoji: '🎭', aliases: ['リージョン'] },
      { name: 'プレイグ', emoji: '🤮', aliases: ['プレイグ'] },
      { name: 'ゴーストフェイス', emoji: '📷', aliases: ['ゴーストフェイス', 'ゴスフェ'] },
      { name: 'デモゴルゴン', emoji: '🌺', aliases: ['デモゴルゴン'] },
      { name: '鬼', emoji: '👹', aliases: ['鬼'] },
      { name: 'デススリンガー', emoji: '🔫', aliases: ['デススリンガー'] },
      { name: 'エクセキューショナー', emoji: '🔺', aliases: ['エクセキューショナー', '三角', '三角頭'] },
      { name: 'ブライト', emoji: '💉', aliases: ['ブライト'] },
      { name: 'ツインズ', emoji: '👯', aliases: ['ツインズ'] },
      { name: 'トリックスター', emoji: '🗡️', aliases: ['トリックスター', 'トリスタ'] },
      { name: 'ネメシス', emoji: '🧟', aliases: ['ネメシス'] },
      { name: 'セノバイト', emoji: '⛓️', aliases: ['セノバイト', 'ピンヘッド'] },
      { name: 'アーティスト', emoji: '🐦⬛', aliases: ['アーティスト'] },
      { name: '怨霊', emoji: '📺', aliases: ['怨霊', '貞子'] },
      { name: 'ドレッジ', emoji: '💀', aliases: ['ドレッジ'] },
      { name: 'ウェスカー', emoji: '😎', aliases: ['ウェスカー', 'マスターマインド'] },
      { name: 'ナイト', emoji: '⚔️', aliases: ['ナイト'] },
      { name: 'スカルマーチャント', emoji: '🛸', aliases: ['スカルマーチャント'] },
      { name: 'シンギュラリティ', emoji: '🤖', aliases: ['シンギュラリティ'] },
      { name: 'ゼノモーフ', emoji: '👽', aliases: ['ゼノモーフ', 'エイリアン'] },
      { name: 'グッドガイ', emoji: '🪆', aliases: ['グッドガイ', 'チャッキー'] },
      { name: 'アンノウン', emoji: '😈', aliases: ['アンノウン'] },
      { name: 'リッチ', emoji: '🧙', aliases: ['リッチ', 'ヴェクナ'] },
      { name: 'ダークロード', emoji: '🧛', aliases: ['ダークロード', 'ドラキュラ'] },
      { name: 'ハウンドマスター', emoji: '🐕', aliases: ['ハウンドマスター'] },
      { name: '喰種', emoji: '🗼', aliases: ['喰種', '金木'] },
      { name: 'アニマトロニック', emoji: '🍕', aliases: ['アニマトロニック', 'スプリングトラップ'] },
      { name: 'ガスー', emoji: '🫁', aliases: ['ガスー'] },
      { name: 'ファースト', emoji: '🕰️', aliases: ['ファースト', 'ヴェクナ'] },
      { name: 'スラッシャー', emoji: '🏒', aliases: ['スラッシャー', 'ジェイソン'] },
      { name: 'ジャッジメント', emoji: '👼', aliases: ['ジャッジメント'] }
    ];

    function normalizeKillerName(input) {
      if (!input) return '';
      const str = input.trim();
      const exact = KILLER_LIST.find(k => k.name === str);
      if (exact) return exact.name;

      for (const k of KILLER_LIST) {
        if (str.includes(k.name)) return k.name;
        for (const alias of k.aliases) {
          if (str.includes(alias)) return k.name;
        }
      }
      return str;
    }

    function getKillerInfo(name) {
      const norm = normalizeKillerName(name);
      return KILLER_LIST.find(k => k.name === norm) || { name: norm, emoji: '👤', aliases: [norm] };
    }

    function getKillerDisplayText(k) {
      const aliasText = k.aliases.filter(a => a !== k.name).join(' / ');
      return `${k.emoji}${k.name}` + (aliasText ? `（${aliasText}）` : '');
    }

    function setupKillerSuggest({ inputId, suggestListId, onSelect, onInputClear, onInput }) {
      const inputEl = document.getElementById(inputId);
      const suggestList = document.getElementById(suggestListId);
      if (!inputEl || !suggestList) return null;

      let activeIndex = -1;
      let currentMatched = [];

      function highlightItem(index) {
        const items = suggestList.querySelectorAll('.suggest-item');
        items.forEach((item, idx) => {
          if (idx === index) {
            item.classList.add('active');
            item.scrollIntoView({ block: 'nearest' });
          } else {
            item.classList.remove('active');
          }
        });
        activeIndex = index;
      }

      function hideSuggest() {
        suggestList.style.display = 'none';
        suggestList.innerHTML = '';
        activeIndex = -1;
        currentMatched = [];
      }

      function renderSuggest(query) {
        const q = (query || '').trim();
        if (!q) {
          hideSuggest();
          if (onInputClear) onInputClear();
          return;
        }

        currentMatched = KILLER_LIST.filter(k => {
          if (k.name.includes(q)) return true;
          for (const a of k.aliases) {
            if (a.includes(q)) return true;
          }
          return false;
        });

        if (currentMatched.length === 0) {
          hideSuggest();
          return;
        }

        suggestList.innerHTML = '';
        activeIndex = -1;

        currentMatched.forEach((k, idx) => {
          const item = document.createElement('div');
          item.className = 'suggest-item';
          item.textContent = getKillerDisplayText(k);
          item.addEventListener('mouseenter', () => {
            highlightItem(idx);
          });
          item.addEventListener('click', () => {
            chooseKiller(k);
          });
          suggestList.appendChild(item);
        });

        suggestList.style.display = 'block';
      }

      function chooseKiller(killer) {
        inputEl.value = killer.name;
        hideSuggest();
        if (onSelect) onSelect(killer);
      }

      inputEl.addEventListener('input', (e) => {
        renderSuggest(e.target.value);
        if (onInput) onInput(e.target.value);
      });

      inputEl.addEventListener('focus', (e) => {
        if (e.target.value.trim()) {
          renderSuggest(e.target.value);
        }
      });

      inputEl.addEventListener('keydown', (e) => {
        const isShowing = suggestList.style.display === 'block' && currentMatched.length > 0;

        if (e.key === 'ArrowDown') {
          if (!isShowing) {
            if (inputEl.value.trim()) {
              renderSuggest(inputEl.value);
            }
            return;
          }
          e.preventDefault();
          let nextIndex = activeIndex + 1;
          if (nextIndex >= currentMatched.length) {
            nextIndex = 0;
          }
          highlightItem(nextIndex);
        } else if (e.key === 'ArrowUp') {
          if (!isShowing) return;
          e.preventDefault();
          let prevIndex = activeIndex - 1;
          if (prevIndex < 0) {
            prevIndex = currentMatched.length - 1;
          }
          highlightItem(prevIndex);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (isShowing && activeIndex >= 0 && activeIndex < currentMatched.length) {
            chooseKiller(currentMatched[activeIndex]);
          }
        } else if (e.key === 'Escape') {
          if (isShowing) {
            e.preventDefault();
            hideSuggest();
          }
        }
      });

      document.addEventListener('click', (e) => {
        const container = inputEl.closest('.killer-input-container');
        if (container && !container.contains(e.target)) {
          hideSuggest();
        }
      });

      return {
        render: renderSuggest,
        hide: hideSuggest
      };
    }

    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem('dbd_favorite_killers') || '["トラッパー", "レイス", "ナース"]');
      } catch (e) {
        return ['トラッパー', 'レイス', 'ナース'];
      }
    }

    function saveFavorites(favs) {
      localStorage.setItem('dbd_favorite_killers', JSON.stringify(favs));
    }

    function getRecentKillers(favs, matches) {
      const recent = [];
      for (let i = matches.length - 1; i >= 0; i--) {
        const kName = normalizeKillerName(matches[i].killer);
        if (kName && !favs.includes(kName) && !recent.includes(kName)) {
          recent.push(kName);
          if (recent.length >= 3) break;
        }
      }
      return recent;
    }

    function selectKiller(name) {
      const killerInput = document.getElementById('killer');
      killerInput.value = name;
      renderKillerQuickButtons();
    }

    function renderKillerQuickButtons() {
      const quickArea = document.getElementById('killerQuickArea');
      const killerInput = document.getElementById('killer');
      const favToggleBtn = document.getElementById('favToggleBtn');
      if (!quickArea || !killerInput) return;

      const favs = getFavorites();
      const matches = JSON.parse(localStorage.getItem('dbd_matches') || '[]');
      const recents = getRecentKillers(favs, matches);
      const currentNorm = normalizeKillerName(killerInput.value);

      if (favToggleBtn) {
        const isFav = Boolean(currentNorm && favs.includes(currentNorm));
        favToggleBtn.textContent = isFav ? '★' : '☆';
        favToggleBtn.classList.toggle('active', isFav);
        favToggleBtn.title = isFav ? 'お気に入りから解除' : 'お気に入りに追加（最大3枠）';
      }

      quickArea.innerHTML = '';

      favs.forEach(kName => {
        const info = getKillerInfo(kName);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'killer-quick-btn' + (currentNorm === info.name ? ' active' : '');
        btn.innerHTML = `<span style="color:#ffd700;font-size:0.75rem;">★</span> ${info.emoji} ${info.name}`;
        btn.addEventListener('click', () => {
          selectKiller(info.name);
        });
        quickArea.appendChild(btn);
      });

      recents.forEach(kName => {
        const info = getKillerInfo(kName);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'killer-quick-btn' + (currentNorm === info.name ? ' active' : '');
        btn.innerHTML = `<span style="color:#888;font-size:0.75rem;">🕒</span> ${info.emoji} ${info.name}`;
        btn.addEventListener('click', () => {
          selectKiller(info.name);
        });
        quickArea.appendChild(btn);
      });
    }

    document.getElementById('favToggleBtn').addEventListener('click', () => {
      const killerInput = document.getElementById('killer');
      const currentNorm = normalizeKillerName(killerInput.value);
      if (!currentNorm) {
        alert('キラー名を入力または選択してください');
        return;
      }
      let favs = getFavorites();
      if (favs.includes(currentNorm)) {
        favs = favs.filter(k => k !== currentNorm);
      } else {
        if (favs.length >= 3) {
          favs.shift();
        }
        favs.push(currentNorm);
      }
      saveFavorites(favs);
      renderKillerQuickButtons();
    });

    const killerSuggestInstance = setupKillerSuggest({
      inputId: 'killer',
      suggestListId: 'killerSuggestList',
      onSelect: (k) => {
        selectKiller(k.name);
      },
      onInput: () => {
        renderKillerQuickButtons();
      },
      onInputClear: () => {
        renderKillerQuickButtons();
      }
    });

    const filterSuggestInstance = setupKillerSuggest({
      inputId: 'filterKiller',
      suggestListId: 'filterSuggestList',
      onSelect: (k) => {
        currentFilterKiller = k.name;
        loadHistory();
      },
      onInput: (val) => {
        currentFilterKiller = (val || '').trim();
        loadHistory();
      },
      onInputClear: () => {
        currentFilterKiller = '';
        loadHistory();
      }
    });

    const filterKillerInput = document.getElementById('filterKiller');
    document.getElementById('resetFilterBtn').addEventListener('click', () => {
      filterKillerInput.value = '';
      currentFilterKiller = '';
      if (filterSuggestInstance) filterSuggestInstance.hide();
      loadHistory();
    });

    setupSelectButtonGroup('gensBtnGroup', 'gensAtFirstKill');
    setupSelectButtonGroup('killsBtnGroup', 'resultKills');
    renderKillerQuickButtons();

    form.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
    });

    function handleRecordMatch() {
      const rawKiller = document.getElementById('killer').value.trim();
      if (!rawKiller) {
        alert('使用キラーを入力または選択してください');
        return;
      }
      const normalizedKiller = normalizeKillerName(rawKiller);

      const newMatch = {
        killer: normalizedKiller || rawKiller,
        gensAtFirstKill: document.getElementById('gensAtFirstKill').value,
        resultKills: document.getElementById('resultKills').value,
        hasCamp: document.getElementById('hasCamp').checked,
        hasTunnel: document.getElementById('hasTunnel').checked,
        date: new Date().toLocaleDateString('ja-JP')
      };
      const matches = JSON.parse(localStorage.getItem('dbd_matches') || '[]');
      matches.push(newMatch);
      localStorage.setItem('dbd_matches', JSON.stringify(matches));
      form.reset();
      resetSelectButtons();
      if (killerSuggestInstance) killerSuggestInstance.hide();
      renderKillerQuickButtons();
      loadHistory();
    }

    const recordBtn = document.getElementById('recordBtn');
    if (recordBtn) {
      recordBtn.addEventListener('click', handleRecordMatch);
    }

    loadHistory();
  </script>
</body>
</html>
